<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css">
  <title>proyecto4</title>
</head>

<body>
  <main>
    <form class="formTable" id="miFormulario" action="result.html">
      <div class="Account">
        Create Account
      </div>
      <div class="Contenidos">
        <label for="fullName">Full Name</label>
        <input type="text" name="fullName" id="fullName">
      </div>
      <div class="Contenidos">
        <label for="email">Email</label>
        <input type="email" name="email" id="email">
      </div>
      <div class="Contenidos">
        <label for="password">Password</label>
        <input type="password" name="password" id="password">
      </div>
      <div class="Contenidos">
        <label for="re-Password">Re-Password</label>
        <input type="password" name="re-Password" id="re-Password">
      </div>
      <div class="Contenidos">
        <label for="country">Select Country</label>
        <div class="custom-select" id="country-select">
          <button class="select-button" type="button">
            <span class="selected-value">Select a country</span>
            <span class="arrow"></span>
          </button>
          <ul class="select-dropdown hidden"></ul>
        </div>
      </div>
      <div class="Caja">
        <input type="checkbox" name="rules" id="rules">
        <label for="rules">i agree to the Rules</label>
      </div>
      <div class="boton">
        <button type="submit" disabled id="submitBtn">Create Account</button>
      </div>
    </form>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
